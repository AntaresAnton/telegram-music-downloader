[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-audio-downloader"
version = "0.1.0"
description = "Clean Architecture Python script to download audio files from Telegram channels with JSON logging."
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0",
    "python-dotenv>=1.0.0",
    "qrcode>=7.4.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
tg-audio-dl = "src.presentation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
